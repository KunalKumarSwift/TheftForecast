# XcodeGen spec for the Toronto Auto Theft Forecast iOS app.
# Generate the Xcode project with:  cd ios && xcodegen generate
# The .xcodeproj is generated, so edit this file (not the project) to change settings.

name: TheftForecast
options:
  bundleIdPrefix: com.example.mba563
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  TheftForecastKit:
    path: Packages/TheftForecastKit
targets:
  # Not named TheftForecast: that is the engine module's name, and the build outputs would collide.
  TheftForecastApp:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TheftForecastKit
        product: TheftForecast
      - package: TheftForecastKit
        product: TheftForecastUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Theft Forecast
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mba563.TheftForecast
        PRODUCT_NAME: TheftForecastApp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  TheftForecastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TheftForecastApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mba563.TheftForecastUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TheftForecastApp
schemes:
  TheftForecastApp:
    build:
      targets:
        TheftForecastApp: all
    test:
      targets: [TheftForecastUITests]
